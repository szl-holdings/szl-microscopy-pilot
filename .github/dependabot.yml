version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # uv, not pip: the pip ecosystem updates .txt and PEP 621 pyproject.toml
  # files but not uv.lock, so its PRs would fail CI's `uv lock --check`.
  # Dependabot security updates for this repository already use uv.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
