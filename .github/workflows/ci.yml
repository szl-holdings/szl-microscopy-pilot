name: ci

# Source CI: proves uv.lock is current and runs the offline unittest suite on
# the declared Python floor (3.11, from requires-python) and the current
# development interpreter (3.12). No secrets, no network writes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}

      - name: Lockfile is current
        run: uv lock --check

      - name: Interpreter and decoder
        run: uv run --frozen python -c "import sys, PIL; print(sys.version); print('Pillow', PIL.__version__)"

      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
